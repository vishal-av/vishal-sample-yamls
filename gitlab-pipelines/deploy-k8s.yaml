stages:
  - build
  - deploy

variables:
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE/node-service
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  K8S_NAMESPACE: production
  K8S_DEPLOYMENT: node-service

# Build and push Docker image to GitLab Container Registry
build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $DOCKER_IMAGE:$IMAGE_TAG .
    - docker tag $DOCKER_IMAGE:$IMAGE_TAG $DOCKER_IMAGE:latest
    - docker push $DOCKER_IMAGE:$IMAGE_TAG
    - docker push $DOCKER_IMAGE:latest
  only:
    - main

# Deploy to Kubernetes using kubectl
deploy:
  stage: deploy
  image: bitnami/kubectl:1.27
  environment:
    name: production
    url: https://myapp.com
  before_script:
    - mkdir -p $HOME/.kube
    - echo "$KUBECONFIG_B64" | base64 -d > $HOME/.kube/config
  script:
    - |
      kubectl set image deployment/$K8S_DEPLOYMENT \
        app=$DOCKER_IMAGE:$IMAGE_TAG \
        -n $K8S_NAMESPACE
    - |
      kubectl rollout status deployment/$K8S_DEPLOYMENT \
        -n $K8S_NAMESPACE \
        --timeout=120s
    - |
      SERVICE_URL=$(kubectl get svc $K8S_DEPLOYMENT -n $K8S_NAMESPACE \
        -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
      curl --fail --retry 3 http://$SERVICE_URL/health
  only:
    - main
  needs:
    - build