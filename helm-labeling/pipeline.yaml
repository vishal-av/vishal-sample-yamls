pipeline:
  name: Helm Labeling Demo
  identifier: helm_labeling_demo
  projectIdentifier: <+input>
  orgIdentifier: <+input>
  tags: {}
  stages:
    - stage:
        name: Deploy with Labels
        identifier: deploy_with_labels
        description: Deploy Helm chart with both release and resource labels
        type: Deployment
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: nginx_with_labels
            serviceInputs:
              serviceDefinition:
                type: Kubernetes
                spec:
                  artifacts:
                    primary:
                      primaryArtifactRef: <+input>
                      sources: <+input>
          environment:
            environmentRef: <+input>
            deployToAll: false
            infrastructureDefinitions:
              - identifier: <+input>
          execution:
            steps:
              - step:
                  name: Rollout Deployment
                  identifier: rolloutDeployment
                  type: K8sRollingDeploy
                  timeout: 10m
                  spec:
                    skipDryRun: false
                    pruningEnabled: false

              - step:
                  name: Verify Helm Release Labels
                  identifier: verify_helm_labels
                  type: ShellScript
                  timeout: 5m
                  spec:
                    shell: Bash
                    onDelegate: true
                    source:
                      type: Inline
                      spec:
                        script: |-
                          #!/bin/bash
                          set -e

                          echo "========================================="
                          echo "HELM RELEASE LABELS VERIFICATION"
                          echo "========================================="

                          NAMESPACE="<+infra.namespace>"

                          echo -e "\n1. List all Helm releases with team=platform label:"
                          helm list -n $NAMESPACE --selector team=platform

                          echo -e "\n2. Get release metadata:"
                          helm get metadata <+service.name> -n $NAMESPACE || echo "Note: Metadata command requires Helm 3.1+"

                          echo -e "\n3. Query by multiple labels:"
                          helm list -n $NAMESPACE --selector "team=platform,owner=myorg"

                          echo -e "\n✅ Helm release labels verified!"
                    environmentVariables: []
                    outputVariables: []

              - step:
                  name: Verify Kubernetes Resource Labels
                  identifier: verify_k8s_labels
                  type: ShellScript
                  timeout: 5m
                  spec:
                    shell: Bash
                    onDelegate: true
                    source:
                      type: Inline
                      spec:
                        script: |-
                          #!/bin/bash
                          set -e

                          echo "========================================="
                          echo "KUBERNETES RESOURCE LABELS VERIFICATION"
                          echo "========================================="

                          NAMESPACE="<+infra.namespace>"

                          echo -e "\n1. Pods with team=platform label:"
                          kubectl get pods -n $NAMESPACE -l team=platform --show-labels

                          echo -e "\n2. All resources with owner=myorg label:"
                          kubectl get all -n $NAMESPACE -l owner=myorg

                          echo -e "\n3. Resources for cost-center=1234:"
                          kubectl get all -n $NAMESPACE -l cost-center=1234 -o wide

                          echo -e "\n4. Detailed pod labels (JSON):"
                          kubectl get pods -n $NAMESPACE -l team=platform -o jsonpath='{.items[0].metadata.labels}' | jq '.'

                          echo -e "\n✅ Kubernetes resource labels verified!"
                    environmentVariables: []
                    outputVariables: []

              - step:
                  name: Label Usage Examples
                  identifier: label_usage_examples
                  type: ShellScript
                  timeout: 5m
                  spec:
                    shell: Bash
                    onDelegate: true
                    source:
                      type: Inline
                      spec:
                        script: |-
                          #!/bin/bash

                          NAMESPACE="<+infra.namespace>"

                          cat << 'EOF'

                          ========================================
                          LABEL USAGE EXAMPLES
                          ========================================

                          Use these commands to query resources by labels:

                          # Helm Release Queries (Option 1)
                          helm list --all-namespaces --selector team=platform
                          helm list --all-namespaces --selector "env=dev,owner=myorg"

                          # Kubernetes Resource Queries (Option 2)
                          kubectl get pods --all-namespaces -l team=platform
                          kubectl get all --all-namespaces -l owner=myorg
                          kubectl get all --all-namespaces -l cost-center=1234

                          # Cost Allocation
                          kubectl get pods --all-namespaces -l cost-center=1234 -o json > cost-report.json

                          # Monitoring Integration
                          kubectl get pods --all-namespaces -l team=platform -o wide

                          # Network Policies (example)
                          # podSelector:
                          #   matchLabels:
                          #     team: platform

                          ========================================
                          ✅ Both Helm release and K8s resource labels are working!
                          ========================================

                          EOF
                    environmentVariables: []
                    outputVariables: []

            rollbackSteps:
              - step:
                  name: Rollback Rollout Deployment
                  identifier: rollbackRolloutDeployment
                  type: K8sRollingRollback
                  timeout: 10m
                  spec:
                    pruningEnabled: false
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
