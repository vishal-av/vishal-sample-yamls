name: Deploy to Kubernetes

on:
  push:
    branches:
      - main

env:
  DOCKER_IMAGE: myapp/node-service
  K8S_NAMESPACE: production
  K8S_DEPLOYMENT: node-service

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set image tag
        id: vars
        run: echo "IMAGE_TAG=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t $DOCKER_IMAGE:${{ steps.vars.outputs.IMAGE_TAG }} .
          docker tag $DOCKER_IMAGE:${{ steps.vars.outputs.IMAGE_TAG }} $DOCKER_IMAGE:latest

      - name: Push Docker image
        run: |
          docker push $DOCKER_IMAGE:${{ steps.vars.outputs.IMAGE_TAG }}
          docker push $DOCKER_IMAGE:latest

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set image tag
        id: vars
        run: echo "IMAGE_TAG=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.27.0"

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Update deployment image
        run: |
          kubectl set image deployment/$K8S_DEPLOYMENT \
            app=$DOCKER_IMAGE:${{ steps.vars.outputs.IMAGE_TAG }} \
            -n $K8S_NAMESPACE

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/$K8S_DEPLOYMENT \
            -n $K8S_NAMESPACE \
            --timeout=120s

      - name: Run smoke test
        run: |
          SERVICE_URL=$(kubectl get svc $K8S_DEPLOYMENT -n $K8S_NAMESPACE \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          curl --fail --retry 3 http://$SERVICE_URL/health